name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  qa:
    uses: ./.github/workflows/ci.yml
  release:
    name: Publish release
    needs: qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish tested tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG" --prerelease
          else
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
